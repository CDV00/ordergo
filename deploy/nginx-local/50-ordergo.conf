# http://ordergo.localhost → OrderGo chạy trên máy host (scripts/run.ps1).
# Từ máy khác / điện thoại trong mạng LAN: http://<ip-may>:8083 (quét QR bàn bằng điện thoại).
#
# Web (Next dev :3200) và API (Nest :4200) chung 1 origin → không cần CORS, cookie phiên QR của khách
# và Socket.IO (realtime) chạy thẳng. Web gọi API bằng đường dẫn tương đối /v1 (NEXT_PUBLIC_API_URL=/v1).
#
# Bản gốc nằm trong repo ordergo: deploy/nginx-local/50-ordergo.conf — scripts/run.ps1 tự chép sang
# D:/Docker/nginx/conf.d và reload nginx. Sửa ở repo, đừng sửa bản trong conf.d.

upstream ordergo_web {
    server host.docker.internal:3200;
    keepalive 8;
}

upstream ordergo_api {
    server host.docker.internal:4200;
    keepalive 16;
}

server {
    listen 80;
    listen 8083;
    server_name ordergo.localhost;

    include /etc/nginx/conf.d/snippets/security-headers.inc;

    # REST API (/v1/*). Ảnh món tối đa 2MB → cho 3MB.
    location /v1/ {
        include /etc/nginx/conf.d/snippets/proxy.inc;
        client_max_body_size 3m;
        proxy_pass http://ordergo_api;
    }

    # Realtime (Socket.IO, namespace /realtime). Kết nối WebSocket giữ lâu → tăng timeout đọc.
    # (không include proxy.inc vì cần timeout dài hơn 120s — nginx không cho khai báo trùng)
    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout    1h;
        proxy_send_timeout    1h;
        proxy_buffering off;
        proxy_pass http://ordergo_api;
    }

    # Ảnh upload (API phục vụ tĩnh, đã có nosniff + CORP)
    location /uploads/ {
        include /etc/nginx/conf.d/snippets/proxy.inc;
        proxy_pass http://ordergo_api;
    }

    # Swagger (chỉ bật ở môi trường dev của API)
    location /api-docs {
        include /etc/nginx/conf.d/snippets/proxy.inc;
        proxy_pass http://ordergo_api;
    }

    # Web app (Next dev server, có WebSocket cho hot reload)
    location / {
        include /etc/nginx/conf.d/snippets/proxy.inc;
        client_max_body_size 5m;
        proxy_pass http://ordergo_web;
    }
}
