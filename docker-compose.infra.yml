name: ordergo-infra

# ─────────────────────────────────────────────────────────
# Chỉ chạy hạ tầng (Mongo + Redis). BE/FE chạy native.
#
# Dùng:
#   docker compose -f docker-compose.infra.yml up -d
#   cd ordergo-api && yarn start:dev
#   cd ordergo-web && yarn dev
#
# Stop:
#   docker compose -f docker-compose.infra.yml down
# ─────────────────────────────────────────────────────────

services:
  mongo:
    image: mongo:7
    container_name: ordergo-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try {
            const s = rs.status();
            if (s.ok === 1) quit(0);
          } catch (e) {
            const r = rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]});
            if (r.ok === 1) quit(0);
            print('rs.initiate failed: ' + r.errmsg);
            quit(1);
          }
        "
      interval: 10s
      timeout: 30s
      start_period: 0s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ordergo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  mongo-config:
  redis-data:
