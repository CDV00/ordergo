name: E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "1"
      # Giá trị giả chỉ dùng cho CI — app bắt buộc secret ≥ 32 ký tự.
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
      E2E_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Submodule private thì cần token có quyền đọc 2 repo con (vd secrets.SUBMODULES_TOKEN).
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Replica set 1 node — cần cho transaction và change streams (realtime).
      # (service container của GitHub không truyền được --replSet nên chạy bằng docker run)
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "rs.isMaster().ismaster" | grep -q true && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Yarn theo đúng version ở "packageManager" trong package.json
      - run: corepack enable

      - name: Install ordergo-api
        working-directory: ordergo-api
        run: yarn install --immutable

      - name: Install ordergo-web
        working-directory: ordergo-web
        run: yarn install --immutable

      - name: Install e2e
        working-directory: e2e
        run: yarn install --immutable

      - name: Build API
        working-directory: ordergo-api
        run: yarn build

      # NEXT_PUBLIC_API_URL được nhúng lúc build → trỏ vào API test ở cổng 4100
      - name: Build web
        working-directory: ordergo-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100/v1
        run: yarn build

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_SKIP_BUILD: "1"
        run: yarn test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
