name: ordergo

services:
  # ─── MongoDB single-node replica set ───────────────────────
  # Replica set bắt buộc cho Mongo transactions (setupWizard, payment...).
  # Healthcheck đảm nhiệm cả init: nếu rs chưa khởi tạo thì initiate; sau
  # đó check rs.status() bình thường. Service chỉ HEALTHY khi rs UP.
  mongo:
    image: mongo:7
    container_name: ordergo-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try {
            const s = rs.status();
            if (s.ok === 1) quit(0);
          } catch (e) {
            const r = rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]});
            if (r.ok === 1) quit(0);
            print('rs.initiate failed: ' + r.errmsg);
            quit(1);
          }
        "
      interval: 10s
      timeout: 30s
      start_period: 0s
      retries: 30
    networks: [ordergo-net]

  # ─── Redis cache + queue + pubsub ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ordergo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ordergo-net]

  # ─── Backend API ───────────────────────────────────────────
  api:
    build:
      context: ./ordergo-api
      dockerfile: Dockerfile
    image: ordergo/api:latest
    container_name: ordergo-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: ${MONGODB_DB:-ordergo}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET không được trống — copy .env.example sang .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET không được trống}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-4000}:4000"
    networks: [ordergo-net]

  # ─── Frontend Web ──────────────────────────────────────────
  web:
    build:
      context: ./ordergo-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/v1}
    image: ordergo/web:latest
    container_name: ordergo-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [ordergo-net]

volumes:
  mongo-data:
  mongo-config:
  redis-data:

networks:
  ordergo-net:
    driver: bridge
